version: "3.9"

services:
  nest:
    image: zoom-cars-backend-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5431"
    # healthcheck:
    #   test: pg_isready
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

networks:
  app-network:
volumes:
  postgres-data:
